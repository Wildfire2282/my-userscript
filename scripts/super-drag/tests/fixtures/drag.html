<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>super-drag fixture</title>
    <style>
      body {
        margin: 0;
        padding: 40px;
        max-width: 900px;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      #text {
        width: 340px;
        padding: 8px;
      }
      #image {
        display: block;
        width: 96px;
        height: 96px;
        background: #d8dee9;
      }
      #click-area {
        padding: 16px;
        border: 1px dashed #94a3b8;
      }
    </style>
  </head>
  <body>
    <p id="text">这段话用来测试拖拽搜索：选中之后拖动应当拿去搜索。</p>
    <p><a id="link" href="https://example.com/target?from=fixture&amp;x=1">一个普通链接</a></p>
    <p><img id="image" alt="fixture" src="https://example.com/image.png" /></p>
    <p><input id="field" type="text" value="输入框" /></p>
    <p><a id="partial-link" href="https://example.com/partial">链接文字前半段和后半段</a></p>
    <div id="editor" contenteditable="true"><p id="editor-text">这里是富文本编辑器</p></div>
    <p>
      <a id="dead-link" href="#"
        ><img id="dead-link-image" alt="wrapped" src="https://example.com/wrapped.png"
      /></a>
    </p>
    <p><a id="relative-link" href="/rel/path?x=1">相对链接</a></p>
    <div id="card" draggable="true">可拖拽卡片（页面自己的拖拽）</div>
    <a id="draggable-dead-link" draggable="true">页面自己的可拖拽控件</a>
    <div id="svg-host"></div>
    <p>
      <img
        id="draggable-image"
        alt="draggable"
        draggable="true"
        src="https://example.com/draggable.png"
      />
    </p>
    <div id="shadow-host"></div>
    <div id="click-area">点击区</div>
    <script>
      // Shadow DOM 夹具：验证事件被重定向到宿主后仍能认领内部链接。
      const host = document.getElementById('shadow-host');
      const root = host.attachShadow({ mode: 'open' });
      const link = document.createElement('a');
      link.id = 'shadow-link';
      link.href = 'https://example.com/shadow';
      link.textContent = 'shadow 里的链接';
      root.appendChild(link);

      // SVG 夹具：站点常用 xlink:href，元素必须用命名空间创建才能带上该属性。
      const SVG_NS = 'http://www.w3.org/2000/svg';
      const XLINK_NS = 'http://www.w3.org/1999/xlink';
      const svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute('width', '120');
      svg.setAttribute('height', '40');
      const svgLink = document.createElementNS(SVG_NS, 'a');
      svgLink.setAttributeNS(XLINK_NS, 'xlink:href', 'https://example.com/svg-link');
      const svgRect = document.createElementNS(SVG_NS, 'rect');
      svgRect.id = 'svg-rect';
      svgRect.setAttribute('width', '120');
      svgRect.setAttribute('height', '40');
      svgRect.setAttribute('fill', '#d8dee9');
      svgLink.appendChild(svgRect);
      svg.appendChild(svgLink);
      document.getElementById('svg-host').appendChild(svg);

      // 记录页面收到的点击，用来验证拖拽结束后的那次 click 被脚本吞掉。
      window.__clicks = 0;
      document.addEventListener('click', () => {
        window.__clicks += 1;
      });
    </script>
  </body>
</html>
