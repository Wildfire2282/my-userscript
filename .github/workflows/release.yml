name: 发布用户脚本

on:
  push:
    branches: [main]
    # 脚本与共享运行时代码变化都进入发布校验；工具、依赖、测试、文档不单独触发。
    # Agent 必须同批给每个实际产物改变的脚本提升 patch 版本；不是只提任一脚本。
    # 未提版本由 release.mjs 现有的“同版本异内容”校验拒绝，不自动写版本。
    # 新增脚本、补发已 push 的发布走 workflow_dispatch。
    paths:
      - 'scripts/*/src/**'
      - 'scripts/*/userscript.meta.*'
      - 'scripts/*/package.json'
      - 'packages/shared/src/**'
      - 'packages/userscript-ui/src/**'
  workflow_dispatch:
    inputs:
      allow_meta_change:
        description: '允许修改 @name / @match / @grant 后发布（需先人工确认）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-userscripts
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 准备 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # 元数据变化（@name / @match / @include / @grant）默认拦下；维护者确认后
      # 在推送的提交信息里写 [allow-meta] 即随本次推送发布，未确认不要写。
      # 本地复验同一开关：ALLOW_META_CHANGE=1 bun run check。
      - name: 检查与构建
        env:
          ALLOW_META_CHANGE: ${{ (inputs.allow_meta_change == true || contains(github.event.head_commit.message || '', '[allow-meta]')) && '1' || '0' }}
        run: bun run check

      - name: 准备 release 分支
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin release >/dev/null 2>&1; then
            git fetch --depth=1 origin +refs/heads/release:refs/remotes/origin/release
            git worktree add --detach "$RELEASE_DIR" origin/release
            git -C "$RELEASE_DIR" checkout -B release origin/release
          else
            git worktree add --detach "$RELEASE_DIR" HEAD
            git -C "$RELEASE_DIR" checkout --orphan release
            git -C "$RELEASE_DIR" rm -rf .
          fi

      - name: 汇总发布物
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
          ALLOW_META_CHANGE: ${{ (inputs.allow_meta_change == true || contains(github.event.head_commit.message || '', '[allow-meta]')) && '1' || '0' }}
        run: node tools/release.mjs "$RELEASE_DIR"

      - name: 推送到 release 分支
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
          SOURCE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          cd "$RELEASE_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有需要发布的变更。"
            exit 0
          fi
          git commit -m "${SOURCE_MESSAGE:-chore(release): 发布构建产物}"
          git push origin HEAD:release
