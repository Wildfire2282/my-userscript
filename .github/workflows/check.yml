name: 检查

# PR 全量检查；main 上工具、测试与配置改动也检查。
# 脚本及共享运行时代码另由 release.yml 检查，并要求受影响脚本同步提版。
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'tools/**'
      - 'tests/**'
      - 'scripts/*/tests/**'
      - '*.json'
      - '*.mjs'
      - '*.ts'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 准备 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 检查与构建
        run: bun run check
